name: Python validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile CLI
        run: python -m py_compile scripts/openshoot.py
      - name: Run sample CLI
        run: python scripts/openshoot.py --account-id 1234567_SB1 --environment sandbox > /dev/null
