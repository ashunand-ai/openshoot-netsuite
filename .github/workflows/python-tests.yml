name: Python validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile CLI
        run: python -m py_compile scripts/openshoot.py
      - name: Run sample CLI
        run: python scripts/openshoot.py --account-id 1234567_SB1 --environment sandbox > /dev/null
      - name: Validate admin CLI offline report
        run: |
          python scripts/admin_readiness.py --account-id 1234567_SB1 --environment sandbox --format json --output admin-report.json
          python -c "import json; d=json.load(open('admin-report.json')); assert d['release_gate']=='BLOCKED'; assert '1234567-sb1.' in d['endpoints_unverified']['all_toolsets']"
      - name: Verify strict mode correctly blocks unknown evidence
        run: |
          set +e
          python scripts/admin_readiness.py --account-id 1234567_SB1 --environment sandbox --evidence examples/evidence.example.json --strict --format json > /dev/null
          status=$?
          set -e
          test "$status" -eq 2
      - name: Build distributable skill ZIP
        run: |
          mkdir -p dist/openshoot-netsuite
          cp SKILL.md dist/openshoot-netsuite/
          cp -r references scripts examples dist/openshoot-netsuite/
          cd dist
          zip -qr skill.zip openshoot-netsuite
      - uses: actions/upload-artifact@v4
        with:
          name: openshoot-netsuite-skill
          path: dist/skill.zip
          if-no-files-found: error
      - name: Validate NetSuite Academy catalog and linked assets
        run: python academy/scripts/validate_catalog.py academy/catalog.json --root .
      - name: Run NetSuite Academy tests
        run: python -m unittest discover -s academy/tests -v
      - name: Package independent NetSuite Academy Skill
        run: |
          mkdir -p dist/openshoot-netsuite-academy
          cp academy/SKILL.md academy/README.md academy/catalog.json dist/openshoot-netsuite-academy/
          cp -r academy/lessons academy/videos academy/scripts academy/tests dist/openshoot-netsuite-academy/
          cd dist
          zip -qr academy-skill.zip openshoot-netsuite-academy
      - uses: actions/upload-artifact@v4
        with:
          name: openshoot-netsuite-academy-skill
          path: dist/academy-skill.zip
          if-no-files-found: error
      - name: Validate executive AI industry-role catalog
        run: python -m unittest discover -s academy/executive-ai/tests -v
      - name: Syntax-check executive learner and backend JS
        run: |
          node --check academy/executive-ai/hatchable/api/pathway.js
          node --check academy/executive-ai/hatchable/public/pathway.js
